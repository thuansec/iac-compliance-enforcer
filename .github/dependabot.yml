# Weekly dependency updates, grouped so minor and patch bumps arrive as one pull request per
# ecosystem. Every update still goes through CI and the `main` ruleset like any other change.
version: 2
updates:
  - package-ecosystem: gomod
    # The product module plus every pinned dev tool module (decision D-07); the glob also picks up
    # tools added later.
    directories:
      - /
      - /tools/*
    schedule:
      interval: weekly
    groups:
      # The engine's OPA library (/) and the opa CLI that checks the policies (/tools/opa) move
      # together in one pull request, majors included (ADR 0002); TestOPAVersionsMatch fails a
      # bump of only one. Listed first because the first matching group wins.
      opa:
        patterns: ["github.com/open-policy-agent/opa"]
        group-by: dependency-name
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
